########################################
# CFS Diagnostics
########################################
# Controls the read-only CFS diagnostics service.
# Output appears in the Fluidd/Mainsail console.

[gcode_shell_command CFS_Diag_Enable]
command: sh /usr/data/helper-script/files/cfs-diag/cfs_diag.sh enable
timeout: 30.0
verbose: true

[gcode_shell_command CFS_Diag_Disable]
command: sh /usr/data/helper-script/files/cfs-diag/cfs_diag.sh disable
timeout: 30.0
verbose: true

[gcode_shell_command CFS_Diag_Status]
command: sh /usr/data/helper-script/files/cfs-diag/cfs_diag.sh status
timeout: 30.0
verbose: true

[gcode_shell_command CFS_Diag_Snapshot]
command: sh /usr/data/helper-script/files/cfs-diag/cfs_diag.sh snapshot
timeout: 60.0
verbose: true

[gcode_shell_command CFS_Diag_Summary]
command: sh /usr/data/helper-script/files/cfs-diag/cfs_diag.sh summary
timeout: 30.0
verbose: true

[gcode_shell_command CFS_Diag_Clean]
command: sh /usr/data/helper-script/files/cfs-diag/cfs_diag.sh clean
timeout: 30.0
verbose: true


[gcode_macro CFS_DIAG_ENABLE]
description: Enable CFS Diagnostics (starts now and with the printer)
gcode:
  RUN_SHELL_COMMAND CMD=CFS_Diag_Enable


[gcode_macro CFS_DIAG_DISABLE]
description: Disable CFS Diagnostics (stops now and does not start with the printer; the log is kept)
gcode:
  RUN_SHELL_COMMAND CMD=CFS_Diag_Disable


[gcode_macro CFS_DIAG_STATUS]
description: Show CFS Diagnostics status and the current CFS box state
gcode:
  RUN_SHELL_COMMAND CMD=CFS_Diag_Status


[gcode_macro CFS_DIAG_SNAPSHOT]
description: Write and show a full CFS diagnostics snapshot now
gcode:
  RUN_SHELL_COMMAND CMD=CFS_Diag_Snapshot


[gcode_macro CFS_DIAG_SUMMARY]
description: Show the last CFS disconnection events and their probable cause
gcode:
  RUN_SHELL_COMMAND CMD=CFS_Diag_Summary


[gcode_macro CFS_DIAG_CLEAN]
description: Delete the CFS Diagnostics log and summary
gcode:
  RUN_SHELL_COMMAND CMD=CFS_Diag_Clean


[gcode_shell_command CFS_Diag_Autorecover_On]
command: sh /usr/data/helper-script/files/cfs-diag/cfs_diag.sh autorecover on
timeout: 30.0
verbose: true

[gcode_shell_command CFS_Diag_Autorecover_Off]
command: sh /usr/data/helper-script/files/cfs-diag/cfs_diag.sh autorecover off
timeout: 30.0
verbose: true


[gcode_macro CFS_DIAG_AUTORECOVER_ON]
description: Turn on the USB auto-recovery of the CFS (resets the USB adapter if the box stays disconnected; never while printing)
gcode:
  RUN_SHELL_COMMAND CMD=CFS_Diag_Autorecover_On


[gcode_macro CFS_DIAG_AUTORECOVER_OFF]
description: Turn off the USB auto-recovery of the CFS
gcode:
  RUN_SHELL_COMMAND CMD=CFS_Diag_Autorecover_Off
