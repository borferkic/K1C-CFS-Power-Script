[gcode_macro BOX_TEST_CLEAN]
gcode:
    # Home if needed
    IF_NEED_HOME
    G0 Z100 F5000

    # Heat the nozzle
    M104 S220
    M109 S220

    {% set count = 1 %}
    {% for i in range(count) %}

    # Move to the extrusion/purge position
    G90
    G0 X148.5 F5000
    M400
    G0 Y225 F5000
    M400
    
    # Extrude the filament
    M83
    G1 E40 F300
    M400

    # Retract the filament
    G1 E-5 F600
    M400

    # Turn the fan on for 4 seconds
    SET_PIN PIN=fan0 VALUE=128
    G4 P4000
    SET_PIN PIN=fan0 VALUE=0
    G4 P3000
    M400

    # Clean the nozzle
    SET_VELOCITY_LIMIT ACCEL=5000 ACCEL_TO_DECEL=30000
    G90
    {% for _ in range(2) %}
    G0 X160 Y225 F2500
    G0 X170 Y225 F2500
    {% endfor %}
    G0 X148.5 Y225 F2500
    M400

    # Return to position
    G90
    G0 Y130 F6000
    M400
    G0 X148.5 F6000
    M400

    {% endfor %}


