##POWER SCRIPT MACROS##

[gcode_macro PS_NOCFS_UNLOAD_FILAMENT]
description: Cut and retract the filament
gcode:
    # Home if needed
    IF_NEED_HOME

    # Lower the bed to a safe height only if needed
    {% set current_z = printer.toolhead.position.z|float %}
    {% if current_z < 30 %}
        G91
        G0 Z{30 - current_z} F1200
        G90
        M400
    {% endif %}

    # Cutter preload position
    G90
    G0 Y180 F12000
    G0 X42 F12000

    # Relieve the nozzle pressure if it is hot
    {% if printer.extruder.temperature >= 170 %}
        M83
        G1 E-10 F300
        M400
    {% endif %}

    # Set the acceleration for the cutting move
    SET_VELOCITY_LIMIT ACCEL=5000 ACCEL_TO_DECEL=30000

    # Cut the filament
    {% for _ in range(1) %}
        G0 X42 Y225.2 F12000
        G0 X42 Y180 F12000
    {% endfor %}
    M400

    # Fully retract the filament
    M83
    G1 E-100 F600
    M400
    

[gcode_macro PS_NOCFS_LOAD_FILAMENT]
description: Load, purge and clean the new filament
gcode:
    # Alert if the printer is not homed
    {% if "xyz" not in printer.toolhead.homed_axes %}
    { action_raise_error("The printer must be homed before loading filament.") }
    {% endif %}
    
    # Purge temperature
    {% set temp = params.EXTRUDER_TEMP|default(220)|int %}
    
    # Lower the bed to a safe height if the toolhead is below Z30
    {% set current_z = printer.toolhead.position.z|float %}
    {% if current_z < 30 %}
    G91
    G0 Z{30 - current_z} F3000
    G90
    M400
    {% endif %}


    # Move to the safe tray position
    G90
    G0 X148.5 F5000
    M400
    G0 Y225 F5000
    M400

    # Heat the nozzle
    M109 S220

    # Load and purge the filament
    M83
    G1 E100 F600
    M400

    # Retract slightly to remove the string
    G1 E-5 F600
    M400

    # Lower the temperature before cleaning
    M109 S180

    # Cool the filament tip
    SET_PIN PIN=fan0 VALUE=128
    G4 P4000
    SET_PIN PIN=fan0 VALUE=0
    G4 P3000
    M400

    # Clean the nozzle
    PS_NOCFS_CLEAN_BRUSH

[gcode_macro PS_NOCFS_CLEAN_BRUSH]
description: Clean the nozzle on the brush
gcode:
    # Check that the toolhead is at the cleaning position
    {% set x = printer.toolhead.position.x|float %}
    {% set y = printer.toolhead.position.y|float %}

    {% if (x - 148.5)|abs > 0.1 or (y - 225)|abs > 0.1 %}
        { action_raise_error("PS_NOCFS_CLEAN_BRUSH: The toolhead must be at X148.5 Y225.") }
    {% endif %}

    # Make two passes over the brush
    {% for _ in range(2) %}
        G0 X150.5 F5000
        G0 X168.5 F5000
    {% endfor %}
    M400

    # Leave the purge tray
    G90
    G0 X148.5 F6000
    M400
    G0 Y200 F6000
    M400

