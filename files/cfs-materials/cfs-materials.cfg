
########################################
# CFS Custom Filaments
########################################
# Adds filaments of your own to the material database of the K1C, so the spools without an
# RFID tag can be named after what they really are (PowerScreen and the CFS card of Fluidd show them).
# Values have no spaces: a "~" stands for a space. The color is RRGGBB, without "#".

[gcode_shell_command CFS_Materials]
command: sh /usr/data/helper-script/files/cfs-materials/cfs_materials.sh
timeout: 30.0
verbose: true


[gcode_macro CFS_ADD_MATERIAL]
description: Add a custom filament, e.g. CFS_ADD_MATERIAL BASE=00001 BRAND=eSun NAME=PLA+~Pro TYPE=PLA NOZZLE=215 MIN=195 MAX=245 COLOR=3B82F6
gcode:
  {% if printer.print_stats.state in ["printing", "paused"] %}
    {action_respond_info("CFS_ADD_MATERIAL: not while printing.")}
  {% elif params.BASE is not defined or params.BRAND is not defined or params.NAME is not defined or params.TYPE is not defined or params.NOZZLE is not defined or params.MIN is not defined or params.MAX is not defined or params.COLOR is not defined %}
    {action_respond_info("CFS_ADD_MATERIAL needs BASE, BRAND, NAME, TYPE, NOZZLE, MIN, MAX and COLOR.")}
  {% else %}
    RUN_SHELL_COMMAND CMD=CFS_Materials PARAMS="add {params.BASE} {params.BRAND} {params.NAME} {params.TYPE} {params.NOZZLE} {params.MIN} {params.MAX} {params.COLOR}"
  {% endif %}


[gcode_macro CFS_REMOVE_MATERIAL]
description: Remove a custom filament (ids 90001-99999), e.g. CFS_REMOVE_MATERIAL ID=90001
gcode:
  {% if printer.print_stats.state in ["printing", "paused"] %}
    {action_respond_info("CFS_REMOVE_MATERIAL: not while printing.")}
  {% elif params.ID is not defined %}
    {action_respond_info("CFS_REMOVE_MATERIAL needs ID.")}
  {% else %}
    RUN_SHELL_COMMAND CMD=CFS_Materials PARAMS="remove {params.ID}"
  {% endif %}


[gcode_macro CFS_LIST_MATERIALS]
description: List the custom filaments
gcode:
  RUN_SHELL_COMMAND CMD=CFS_Materials PARAMS="list"
